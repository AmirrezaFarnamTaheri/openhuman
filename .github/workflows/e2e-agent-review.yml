---
name: E2E (Linux) - agent-review
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  packages: read
concurrency:
  group: e2e-agent-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e-agent-review:
    name: E2E agent-review
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      run_linux: true
      run_macos: false
      run_windows: false
      full: false
      spec_path: test/e2e/specs/agent-review.spec.ts
      spec_label: agent-review
      run_rust_e2e: false
      upload_artifacts_always: true
      artifact_name: e2e-agent-review-artifacts

# Third attempt: exact zdiff3 delimiter parser repaired. This workflow exists on the isolated
# sync branch and must be removed before the final PR is merged into main.
name: Fork upstream integration preflight

on:
  push:
    branches:
      - sync/upstream-2026-10-27
    paths:
      - .github/workflows/fork-upstream-integration.yml

permissions:
  contents: write

concurrency:
  group: fork-upstream-integration-2026-10-27
  cancel-in-progress: false

jobs:
  merge-preflight:
    if: github.repository == 'AmirrezaFarnamTaheri/openhuman'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated fork branch, with complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Do NOT use a partial promisor clone: Git resolves missing upstream
          # objects against fork origin, causing 'not our ref' during the merge.
          submodules: false
          persist-credentials: true
      - name: Fetch current upstream main and attempt a real three-way merge
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'openhuman-upstream-sync[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.hooksPath /dev/null
          git remote add upstream https://github.com/tinyhumansai/openhuman.git
          git fetch --no-tags upstream main
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          fork_sha="$(git rev-parse HEAD)"
          merge_base="$(git merge-base HEAD FETCH_HEAD)"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "fork_sha=$fork_sha" >> "$GITHUB_OUTPUT"
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"
          echo "HEAD FORK: $fork_sha"
          echo "UPSTREAM: $upstream_sha"
          echo "MERGE BASE: $merge_base"
          echo "AHEAD/BEHIND $(git rev-list --left-right --count HEAD...FETCH_HEAD)"
          mkdir -p /tmp/upstream-merge-report
          {
            echo "fork=$fork_sha"
            echo "upstream=$upstream_sha"
            echo "merge_base=$merge_base"
          } > /tmp/upstream-merge-report/refs.txt
          set +e
          git -c merge.conflictStyle=zdiff3 merge --no-commit --no-ff FETCH_HEAD -m "merge: integrate tinyhumansai/openhuman main ($upstream_sha)"
          merge_exit="$?"
          set -e
          echo "merge_exit=$merge_exit" >> "$GITHUB_OUTPUT"
          git status --short > /tmp/upstream-merge-report/status.txt
          git diff --name-only --diff-filter=U > /tmp/upstream-merge-report/conflicts.txt
          git diff --cc > /tmp/upstream-merge-report/combined-diff.txt || true
          git ls-files -u > /tmp/upstream-merge-report/stages.txt
          conflict_count="$(wc -l < /tmp/upstream-merge-report/conflicts.txt)"
          echo "conflict_count=$conflict_count" >> "$GITHUB_OUTPUT"
          echo "CONFLICT_COUNT=$conflict_count"
          cat /tmp/upstream-merge-report/conflicts.txt
          if [ "$merge_exit" -ne 0 ]; then
            if [ "$conflict_count" -eq 0 ]; then
              echo "::error::Merge failed without unmerged entries; inspect git diagnostics"
              exit 1
            fi
            # The exact conflicts were inventoried in preflight run 40485988929.
            # Resolve only reviewed hunks, preserving all non-overlapping edits.
            python3 scripts/ci/upstream-merge-resolve.py
          fi
          if git ls-files -u | grep -q .; then
            echo "::error::Unmerged index entries still exist"
            exit 1
          fi
          # Historical upstream patch files intentionally preserve whitespace as exact diffs.
          git diff --cached --check -- . ':!docs/handoffs/*.patch'
          python3 -m json.tool app/package.json >/dev/null
          python3 -m json.tool crates/openhuman-app/tauri.conf.json >/dev/null
          python3 -m json.tool scripts/ci/process-statics.json >/dev/null
          python3 -m json.tool scripts/ci/saas-ambient-baseline.json >/dev/null
          python3 -m json.tool scripts/ci/agent-runtime-boundary-baseline.json >/dev/null
          echo "resolved=true" >> "$GITHUB_OUTPUT"
          echo "Creating a two-parent merge commit without dropping either history"
          git commit -m "merge(upstream): integrate tinyhumansai/openhuman main $upstream_sha"
          git push origin HEAD:sync/upstream-2026-10-27
      - name: Upload conflict inventory and combined diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-merge-preflight
          path: /tmp/upstream-merge-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Block completion until conflicts are resolved
        if: steps.merge.outputs.resolved != 'true'
        env:
          CONFLICT_COUNT: ${{ steps.merge.outputs.conflict_count }}
        run: |
          echo "::error::Upstream has $CONFLICT_COUNT overlapping files requiring resolution; see conflict artifact."
          exit 1

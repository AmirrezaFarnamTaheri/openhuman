name: Fork release kickoff
on:
  push:
    paths:
      - .github/workflows/fork-release-kickoff.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'AmirrezaFarnamTaheri/openhuman'
    runs-on: ubuntu-latest
    steps:
      - name: Start existing production release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/${GH_REPO}/actions/workflows/release-production.yml/dispatches" \
            -f ref=main \
            -f 'inputs[release_type]=patch' \
            -f 'inputs[create_release]=true' \
            -f 'inputs[signed_release]=false'

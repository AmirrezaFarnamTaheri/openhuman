name: Fork release kickoff
# One-time recovery cleanup: the corrected release was already dispatched by
# run 40483391285. Stop the superseded, inevitably failing v0.64.23 build so
# it cannot block the corrected run in the production concurrency queue.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fork-release-kickoff.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  cancel-superseded:
    if: github.repository == 'AmirrezaFarnamTaheri/openhuman' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the superseded v0.64.23 production run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh api --method POST "repos/${GH_REPO}/actions/runs/40481122587/cancel"; then
            echo "::notice::Superseded production run was already cancelled or finished."
          fi

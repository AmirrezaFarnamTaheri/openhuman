---
# Only Windows exposes Win32 5 (access denied) and 32 (sharing violation).
# The encrypted-store master key and ciphertext are never read from user data.
name: Windows encrypted secret-store lock diagnostics

on:
  pull_request:
    branches: [main, release]
    paths:
      - '.github/workflows/windows-secret-lock.yml'
      - 'crates/openhuman-core/src/security/secret_storage/adapter.rs'
      - 'crates/openhuman-core/src/security/secret_storage/adapter_tests.rs'
      - 'crates/openhuman-core/src/security/secret_storage/encrypted_file_backend.rs'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: windows-secret-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-lock:
    name: Win32 credential lock diagnostics
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Allow long submodule fixture paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout pinned dependencies
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
          key: secret-lock-windows

      - name: Verify Windows error categorization without credentials
        shell: bash
        run: |
          cargo test --locked -p openhuman --lib \
            security::secret_storage::adapter::tests::windows_lock_errors_distinguish_access_denied_from_sharing_violations \
            -- --exact --nocapture

      - name: Retry only temporary Win32 lock sharing conflicts
        shell: bash
        run: |
          cargo test --locked -p openhuman --lib \
            security::secret_storage::adapter::tests::temporary_windows_sharing_violation_retries_and_retains_the_operation_result \
            -- --exact --nocapture

      - name: Refuse retries for access denied
        shell: bash
        run: |
          cargo test --locked -p openhuman --lib \
            security::secret_storage::adapter::tests::windows_access_denied_is_not_retried_or_misreported_as_transient \
            -- --exact --nocapture

      - name: Fail safely when temporary Windows lock cannot be obtained
        shell: bash
        run: |
          cargo test --locked -p openhuman --lib \
            security::secret_storage::adapter::tests::persistent_windows_sharing_violation_ends_with_a_real_error_after_bounded_retries \
            -- --exact --nocapture

      - name: Guard against native error payload disclosure
        shell: bash
        run: |
          cargo test --locked -p openhuman --lib \
            security::secret_storage::adapter::tests::lock_error_details_never_echo_the_underlying_native_error_payload \
            -- --exact --nocapture

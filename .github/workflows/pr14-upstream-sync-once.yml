name: PR 14 upstream integration (one-shot)
on:
  push:
    branches:
      - ux/low-friction-product-pass-20261017
    paths:
      - .github/workflows/pr14-upstream-sync-once.yml
permissions:
  contents: write
concurrency:
  group: pr14-upstream-sync
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch without submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - name: Fetch and three-way merge canonical upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="ux/low-friction-product-pass-20261017"
          expected="$GITHUB_SHA"
          current="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          if [ "$current" != "$expected" ]; then
            echo "::error::Branch moved during integration; refusing to merge an obsolete snapshot"
            exit 3
          fi
          git remote add canonical https://github.com/tinyhumansai/openhuman.git
          git fetch --no-tags canonical +refs/heads/main:refs/remotes/canonical/main
          incoming="$(git rev-parse refs/remotes/canonical/main)"
          echo "Canonical upstream: $incoming"
          echo "Branch at checkout: $(git rev-parse HEAD)"
          echo "Merge base: $(git merge-base HEAD "$incoming")"
          mkdir -p upstream-sync-report
          printf '%s\n' "$incoming" > upstream-sync-report/upstream-sha.txt
          printf '%s\n' "$expected" > upstream-sync-report/branch-sha.txt
          if git merge-base --is-ancestor "$incoming" HEAD; then
            echo "Already caught up with canonical upstream"
            exit 0
          fi
          status=0
          git -c merge.renameLimit=10000 merge --no-edit --no-commit --no-ff "$incoming" || status=$?
          if [ "$status" -ne 0 ]; then
            git diff --name-only --diff-filter=U | tee upstream-sync-report/conflicts.txt
            git ls-files -u > upstream-sync-report/unmerged-stages.txt
            git diff --cc > upstream-sync-report/combined-conflicts.diff
            git status --short > upstream-sync-report/status.txt
            echo "Merge requires explicit resolution of $(wc -l < upstream-sync-report/conflicts.txt) paths"
            python3 -m py_compile scripts/ci/pr14-upstream-resolution-once.py
            python3 scripts/ci/pr14-upstream-resolution-once.py
          fi
          # The token can merge source content but cannot update workflow files.
          # Preserve the branch's workflows here, then apply reviewed upstream
          # workflow updates with the GitHub connector after the merge.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          if git diff --name-only --diff-filter=U | grep .; then
            echo "::error::Unresolved index stages remain"
            exit 2
          fi
          node --check scripts/ci/storage-bypass-debt.mjs
          node --check scripts/ci/check-openhuman-rust-layout.mjs
          git diff --cached --check
          echo "Staged source changes:"
          git diff --cached --stat | tail -n 55
          git commit -m "merge: integrate latest canonical OpenHuman main ($incoming)"
          git push origin "HEAD:refs/heads/$branch"
          echo "Merged canonical upstream $incoming into PR #14"
      - name: Upload merge-conflict details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr14-upstream-merge-conflicts
          path: upstream-sync-report/
          if-no-files-found: warn

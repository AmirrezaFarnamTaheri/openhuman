          cat > ci-out/atomic-phases.md <<'PHASES'
          # Atomic storage diagnostic phase map
          
          This is an observer on source 94e8d9cba539a3c025369f02da5aee42f6e34bda.
          It is not a production repair or clean validation of unmodified source.
          No new task, application future wrapper, logging thread, channel, Config clone, or timeout is added.
          The helper uses fixed atomic slots and borrowed-byte hashing.
          
          | Kind | Phase | Meaning |
          |---|---|---|
          | 1 | 10, 11 | Document address: runtime, owned-registration join |
          | 2 | 19, 20, 21, 22, 23, 24, 25 | Registration: scope key, SERVED wait, lock/cache, module serve, existing test gate, existing trace, insert |
          | 3 | 30, 31 | Module serve caller: runtime, existing child join |
          | 4 | 40, 41, 42 | Existing module serve child: path parse, RequestName, serve_at |
          | 5 | 50, 51 | Workspace backend map: lock wait, lock held |
          | 6 | 60, 61 | Backend OnceCell: waiter, initializer owner |
          | 7 | 70, 71, 72 | store_in: entry, preceding migration, requested operation |
          | 8 | 80, 81, 82 | Binding::offload: entry, existing spawned future join, existing inline future |
          | 9 | 90, 91 | Storage bridge: singleton, bridge.run |
          | 11 | 110, 111, 112 | store_raw: StoreRequest/store_config, ScheduleStore, decode |
          | 12 | 62, 63, 64, 65 | Backend open: existing test gate, directory preparation, existing trace, storage open |
          | 13 | 130, 131, 132, 133 | Cron call: proxy readiness, existing trace, proxy.call, error trace |
          | 14 | 139, 140, 141, 142 | Storage open: URL parse/log, driver open, boot migration, wrap/return |
          
          Slot words are id, kind, phase, key, resource, parent, link, reserved.
          Kind 2 resource is &SERVED; its link is the callback path hash, matching kind 3/4 key.
          Kind 3 owns kind 4 via parent id.
          Kind 6 resource is the exact Arc OnceCell address; initializer parent identifies its waiter.
          Kind 7/11 resource is 1 for a Migrate operation and 0 otherwise.
          Kind 8 resource is the Binding address. Kind 9 resource is the bridge singleton address.
          Kind 13 resource hashes the member name.
          Hashes use length-prefixed FNV-1a on borrowed bytes.
          Id 0 is free; u64::MAX is an in-progress slot claim and its payload is inconclusive.
          A nonzero dropped counter means absence of an observer cannot exclude a wait.
          The debugger stops all threads and reads memory only. It never calls inferior functions.
          PHASES
          python3 -m py_compile ci-out/atomic-apply.py
          python3 ci-out/atomic-apply.py
          cargo fmt --all
          git diff --stat
          git diff --binary > ci-out/atomic-source.patch

      - name: Compile the storage target with atomic observers
        run: |
          set -euo pipefail
          set -a
          . ci-out/test-modules-storage-drivers.env
          set +a
          bash scripts/ci-cancel-aware.sh cargo test -p openhuman \
            --features storage-sqlite,storage-file --lib \
            --no-run --message-format=json-render-diagnostics > ci-out/storage-build.jsonl
          jq -c 'select(.reason == "compiler-artifact" and .executable != null) | {target: .target.name, kind: .target.kind, test: .profile.test, executable: .executable}' ci-out/storage-build.jsonl
          mapfile -t binaries < <(jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .target.name == "openhuman_core" and .executable != null) | .executable' ci-out/storage-build.jsonl | sort -u)
          test "${#binaries[@]}" -eq 1
          test -x "${binaries[0]}"
          printf '%s\n' "${binaries[0]}" > ci-out/storage-executable.txt
          gdb --batch --nx --quiet "${binaries[0]}" \
            -ex 'info address PR17_DIAG_META' \
            -ex 'info address PR17_DIAG_SLOTS' \
            -ex 'info address PR17_DIAG_DROPPED' \
            2>&1 | tee ci-out/atomic-symbols.log
          ! rg -q 'No symbol|not defined' ci-out/atomic-symbols.log
          for symbol in PR17_DIAG_META PR17_DIAG_SLOTS PR17_DIAG_DROPPED; do
            rg -q "$symbol" ci-out/atomic-symbols.log
          done
      - name: Run the diagnostic suite and capture after inactivity
        run: |
          set -euo pipefail
          set -a
          . ci-out/test-modules-storage-drivers.env
          set +a
          export PR17_DIAG_OUT="$GITHUB_WORKSPACE/ci-out"
          export PR17_EXPECTED_EXE="$(cat ci-out/storage-executable.txt)"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$RUNNER_TEMP/pr17-late-attach.py"
          diagnostic_failure=0
          for attempt in 1 2 3; do
            export PR17_ATTEMPT="$attempt"
            export PR17_DEADLINE_MONOTONIC="$(python3 -c 'import time; print(time.monotonic() + 600.0)')"
            result="$PR17_DIAG_OUT/storage-attempt-$attempt.result.json"
            rm -f "$result"
            set +e
            # The runner enforces 600s for the test plus 15s termination grace.
            # This outer bound also permits debugger and pipe cleanup.
            timeout --signal=TERM --kill-after=15s 645s \
              bash scripts/ci-cancel-aware.sh cargo test -p openhuman \
              --features storage-sqlite,storage-file --lib -- \
              storage:: cron:: flows:: security::approval:: security::devices:: \
              security::secret_storage:: security::credentials:: desktop::notifications:: \
              integrations::task_sources:: integrations::composio::file_store \
              agent::orchestration:: config::workspace:: desktop::app_state:: \
              desktop::control:: platform::cost:: inference::tokenjuice:: \
              config::schema::load::source:: \
              --skip cron::bus_host::tests:: --skip cron::documents_port::tests::
            cargo_status=$?
            set -e
            if [ ! -f "$result" ]; then
              printf 'PR17_HARNESS_FAILURE: no native result; cargo_status=%s\n' "$cargo_status"
              [ "$cargo_status" -eq 0 ] && exit 1
              exit "$cargo_status"
            fi
            cat "$result"
            attempt_status=$(jq -r '.exit_status' "$result")
            attached=$(jq -r '.attach_requested' "$result")
            printf 'PR17_STORAGE_ATTEMPT_STATUS attempt=%s cargo_status=%s native_status=%s attached=%s\n' "$attempt" "$cargo_status" "$attempt_status" "$attached"
            if [ "$attempt_status" -eq 0 ] && [ "$cargo_status" -ne 0 ]; then
              exit "$cargo_status"
            fi
            if [ "$attached" = true ]; then
              printf 'PR17_DIAGNOSTIC_ONLY: an attach was attempted; this is not clean native validation.\n'
              [ "$attempt_status" -ne 0 ] || exit 86
              exit "$attempt_status"
            fi
            if [ "$attempt_status" -eq 101 ]; then
              diagnostic_failure=101
            elif [ "$attempt_status" -ne 0 ]; then
              exit "$attempt_status"
            fi
          done
          exit "$diagnostic_failure"
      - name: Print captured stacks for remote inspection
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path("ci-out").glob("storage-attempt-*-gdb.log")):
              text = path.read_text(encoding="utf-8", errors="replace")
              print(f"PR17_GDB_LOG_BEGIN {path.name} chars={len(text)}")
              print(text[:3000000])
              if len(text) > 3000000:
                  print("PR17_GDB_LOG_TRUNCATED; complete capture is in the artifact")
              print(f"PR17_GDB_LOG_END {path.name}")

          use std::sync::atomic::{AtomicU64, Ordering};
          
          const COUNT: usize = 1024;
          const CLAIMED: u64 = u64::MAX;
          
          #[repr(C, align(64))]
          struct Slot([AtomicU64; 8]);
          
          impl Slot {
              const fn new() -> Self {
                  Self([const { AtomicU64::new(0) }; 8])
              }
          }
          
          const _: [(); 64] = [(); std::mem::size_of::<Slot>()];
          
          #[used]
          #[unsafe(no_mangle)]
          static PR17_DIAG_META: [u64; 4] = [0x50523137, 1, COUNT as u64, 64];
          
          #[used]
          #[unsafe(no_mangle)]
          static PR17_DIAG_SLOTS: [Slot; COUNT] = [const { Slot::new() }; COUNT];
          
          #[used]
          #[unsafe(no_mangle)]
          static PR17_DIAG_DROPPED: AtomicU64 = AtomicU64::new(0);
          
          static NEXT_ID: AtomicU64 = AtomicU64::new(1);
          
          pub(crate) struct Span {
              index: usize,
              id: u64,
          }
          
          impl Span {
              pub(crate) fn new(kind: u64, phase: u64, key: u64, resource: u64, parent: u64) -> Self {
                  std::hint::black_box(&PR17_DIAG_META);
                  let id = NEXT_ID.fetch_add(1, Ordering::Relaxed);
                  if id != 0 && id != CLAIMED {
                      let start = id as usize % COUNT;
                      for offset in 0..COUNT {
                          let index = (start + offset) % COUNT;
                          let words = &PR17_DIAG_SLOTS[index].0;
                          if words[0]
                              .compare_exchange(0, CLAIMED, Ordering::Acquire, Ordering::Relaxed)
                              .is_ok()
                          {
                              for (index, value) in [kind, phase, key, resource, parent, 0, 0]
                                  .into_iter()
                                  .enumerate()
                              {
                                  words[index + 1].store(value, Ordering::Relaxed);
                              }
                              words[0].store(id, Ordering::Release);
                              return Self { index, id };
                          }
                      }
                  }
                  PR17_DIAG_DROPPED.fetch_add(1, Ordering::Relaxed);
                  Self { index: COUNT, id: 0 }
              }
          
              pub(crate) fn id(&self) -> u64 {
                  self.id
              }
          
              pub(crate) fn phase(&self, phase: u64) {
                  if self.index < COUNT {
                      PR17_DIAG_SLOTS[self.index].0[2].store(phase, Ordering::Release);
                  }
              }
          
              pub(crate) fn link(&self, link: u64) {
                  if self.index < COUNT {
                      PR17_DIAG_SLOTS[self.index].0[6].store(link, Ordering::Relaxed);
                  }
              }
          }
          
          impl Drop for Span {
              fn drop(&mut self) {
                  if self.index < COUNT {
                      PR17_DIAG_SLOTS[self.index].0[0].store(0, Ordering::Release);
                  }
              }
          }
          
          pub(crate) fn hash_parts(parts: &[&[u8]]) -> u64 {
              let mut hash = 0xcbf29ce484222325_u64;
              for part in parts {
                  for byte in (part.len() as u64).to_le_bytes() {
                      hash = (hash ^ u64::from(byte)).wrapping_mul(0x100000001b3);
                  }
                  for &byte in *part {
                      hash = (hash ^ u64::from(byte)).wrapping_mul(0x100000001b3);
                  }
              }
              hash
          }
          RS

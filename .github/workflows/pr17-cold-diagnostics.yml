---
name: PR17 Rust formatting diagnostic

on:
  push:
    branches: [codex/pr17-cold-diagnostics-20261024]

permissions:
  contents: read
  packages: read

concurrency:
  group: pr17-cold-diagnostics
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  rust-format:
    name: Inspect exact PR Rust formatting
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: ghcr.io/tinyhumansai/openhuman_ci:latest@sha256:c3c20d625bcc9f75e50c3c2c2b75c88d3e60a3f4352b0f19f5327b490438722d
      options: --init
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout diagnostic snapshot of PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out pinned submodules
        run: bash scripts/ci/checkout-submodules.sh
      - name: Check required Rust formatting
        run: |
          bash scripts/ci-cancel-aware.sh cargo fmt --manifest-path Cargo.toml \
            --package openhuman --package openhuman-cli --package openhuman-embed \
            --package openhuman-modules-linked --package openhuman-rpc \
            --package openhuman-tinyhumans --package openhuman-tui -- --check
      - name: Print exact formatter repair when the check fails
        if: failure()
        run: |
          bash scripts/ci-cancel-aware.sh cargo fmt --manifest-path Cargo.toml \
            --package openhuman --package openhuman-cli --package openhuman-embed \
            --package openhuman-modules-linked --package openhuman-rpc \
            --package openhuman-tinyhumans --package openhuman-tui
          git diff -- crates

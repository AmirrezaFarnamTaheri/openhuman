---
name: PR17 atomic storage wait diagnostics

on:
  push:
    branches: [codex/pr17-storage-atomic-debug-20261024]

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: pr17-storage-atomic-debug
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  hosted-evidence:
    name: Inspect timed-out hosted storage evidence
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and verify the archived storage lane
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/12568291058/zip" \
            -o "$RUNNER_TEMP/pr17-hosted-storage.zip"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import zipfile

          archive = Path(os.environ["RUNNER_TEMP"]) / "pr17-hosted-storage.zip"
          expected = "44ccfab91ca18895c2ca0a65d65d8ff7101addd008fc7650596415d7469ae2c6"
          data = archive.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          assert digest == expected, (digest, expected)
          print(f"PR17_HOSTED_ARCHIVE_VERIFIED id=12568291058 bytes={len(data)} sha256={digest}")
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  if item.is_dir():
                      continue
                  assert item.file_size <= 10_000_000, (item.filename, item.file_size)
                  payload = bundle.read(item)
                  if b"\x00" in payload:
                      print(f"PR17_HOSTED_BINARY {item.filename} bytes={len(payload)}")
                      continue
                  text = payload.decode("utf-8", errors="replace")
                  print(f"PR17_HOSTED_FILE_BEGIN {item.filename} chars={len(text)}")
                  print(text[:1_000_000])
                  if len(text) > 1_000_000:
                      print("PR17_HOSTED_FILE_TRUNCATED")
                  print(f"PR17_HOSTED_FILE_END {item.filename}")
          PY

  storage-wait:
    name: Inspect atomic storage waits (cohort ${{ matrix.cohort }})
    strategy:
      fail-fast: false
      matrix:
        cohort: [1, 2, 3]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: ghcr.io/tinyhumansai/openhuman_ci:latest@sha256:c3c20d625bcc9f75e50c3c2c2b75c88d3e60a3f4352b0f19f5327b490438722d
      options: --init --cap-add=SYS_PTRACE
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      RUST_MIN_STACK: "16777216"
      GH_TOKEN: ${{ github.token }}
      NPM_CONFIG_STORE_DIR: .pnpm-store
    steps:
      - name: Reclaim container build space
        run: rm -rf /__t/* || true
      - name: Checkout exact production source
        uses: actions/checkout@v7
        with:
          ref: 94e8d9cba539a3c025369f02da5aee42f6e34bda
          fetch-depth: 1
          persist-credentials: false
      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out pinned submodules
        run: bash scripts/ci/checkout-submodules.sh
      - name: Restore storage build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/openhuman-app -> target
          cache-on-failure: true
          shared-key: ci-fast-storage
      - name: Install diagnostic tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gdb jq ripgrep python3-tomli
      - name: Stage the same test modules as hosted storage
        run: |
          mkdir -p ci-out
          bash scripts/ci/self-hosted/install-test-modules.sh \
            "/tmp/openhuman-test-modules-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/storage-drivers" \
            ci-out/test-modules-storage-drivers.env
      - name: Prepare and verify bounded late attachment
        run: |
          set -euo pipefail
          test "$(id -u)" -eq 0
          test "$(git rev-parse HEAD)" = 94e8d9cba539a3c025369f02da5aee42f6e34bda
          git diff --exit-code
          cat > "$RUNNER_TEMP/pr17-late-attach.py" <<'PY'
          #!/usr/bin/env python3
          import json
          import os
          from pathlib import Path
          import re
          import signal
          import select
          import subprocess
          import sys
          import threading
          import time
          
          QUIET_SECONDS = 180.0
          GDB_SECONDS = 60.0
          KILL_GRACE = 15.0
          ANSI = re.compile(rb"\x1b\[[0-?]*[ -/]*[@-~]")
          COMPLETED = re.compile(rb"^test .+ \.\.\. (?:ok|FAILED|ignored)(?:\b|$)")
          
          def group_signal(pid, sig):
              try:
                  os.killpg(pid, sig)
              except ProcessLookupError:
                  pass
          
          def stop_group(proc):
              if proc.poll() is None:
                  group_signal(proc.pid, signal.SIGTERM)
                  try:
                      proc.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      group_signal(proc.pid, signal.SIGKILL)
                      proc.wait(timeout=5)
          
          ATOMIC_CAPTURE = """try:
              import json
              import struct
              gdb.execute("set may-call-functions off")
              gdb.execute("set language c")
              assert int(gdb.parse_and_eval("sizeof(void *)")) == 8, "expected 64-bit target"
              assert "little endian" in gdb.execute("show endian", to_string=True), "unexpected byte order"
              def read_symbol(name, size):
                  address = int(gdb.parse_and_eval("(void *)&" + name))
                  return bytes(gdb.selected_inferior().read_memory(address, size))
              meta = struct.unpack("<4Q", read_symbol("PR17_DIAG_META", 32))
              assert meta == (0x50523137, 1, 1024, 64), ("unsupported diagnostic layout", meta)
              dropped, = struct.unpack("<Q", read_symbol("PR17_DIAG_DROPPED", 8))
              data = read_symbol("PR17_DIAG_SLOTS", meta[2] * meta[3])
              records = []
              for index in range(meta[2]):
                  words = struct.unpack_from("<8Q", data, index * meta[3])
                  if words[0] == 0:
                      continue
                  names = ("id", "kind", "phase", "key", "resource", "parent", "link", "reserved")
                  record = dict(zip(names, words))
                  record["slot"] = index
                  record["claimed"] = words[0] == 0xffffffffffffffff
                  records.append(record)
              print("PR17_ATOMIC_HEADER " + json.dumps({"layout": meta, "dropped": dropped, "active": len(records)}, sort_keys=True), flush=True)
              for record in records:
                  print("PR17_ATOMIC " + json.dumps(record, sort_keys=True), flush=True)
          except Exception as error:
              print('PR17_ATOMIC_ERROR ' + repr(error), flush=True)
          """
          
          def start_gdb(pid, prefix, *, atomic=False):
              commands = prefix.with_suffix(".gdb")
              log_path = prefix.with_suffix(".log")
              commands.write_text(
                  "set pagination off\nset confirm off\nset print thread-events off\nset non-stop off\n"
                  "set debuginfod enabled off\nset auto-load off\n"
                  "set print frame-arguments none\n"
                  "python\n"
                  f"pid = {pid}\n"
                  "try:\n"
                  "    gdb.execute('attach %d' % pid)\n"
                  "    if gdb.selected_inferior().pid != pid:\n"
                  "        raise gdb.GdbError('attach did not select the target')\n"
                  "    print('PR17_GDB_ATTACHED pid=%d' % pid, flush=True)\n"
                  + ("".join("    " + line + "\n" for line in ATOMIC_CAPTURE.splitlines()) if atomic else "")
                  + "    gdb.execute('info threads')\n"
                  "    gdb.execute('thread apply all bt 96')\n"
                  "finally:\n"
                  "    if gdb.selected_inferior().pid == pid:\n"
                  "        gdb.execute('detach')\n"
                  "        print('PR17_GDB_DETACHED pid=%d' % pid, flush=True)\n"
                  "end\nquit\n",
                  encoding="utf-8",
              )
              log = log_path.open("wb")
              try:
                  proc = subprocess.Popen(
                      ["gdb", "--batch", "--nx", "--quiet", "-x", str(commands)],
                      stdout=log, stderr=subprocess.STDOUT, start_new_session=True,
                  )
              except BaseException:
                  log.close()
                  raise
              return proc, log, log_path
          
          def probe(out):
              child = subprocess.Popen([os.environ["PR17_ATOMIC_PROBE"]], stdout=subprocess.PIPE, start_new_session=True)
              debugger = None
              log = None
              try:
                  readable, _, _ = select.select([child.stdout], [], [], 5.0)
                  if not readable or child.stdout.readline() != b"ready\n":
                      raise RuntimeError("atomic attach probe did not become ready")
                  debugger, log, log_path = start_gdb(child.pid, out / "attach-probe", atomic=True)
                  try:
                      rc = debugger.wait(timeout=GDB_SECONDS)
                  except subprocess.TimeoutExpired:
                      stop_group(debugger)
                      raise RuntimeError("harmless-child GDB attach exceeded 60 seconds")
                  log.close()
                  log = None
                  data = log_path.read_text(encoding="utf-8", errors="replace")
                  attached = f"PR17_GDB_ATTACHED pid={child.pid}" in data
                  detached = f"PR17_GDB_DETACHED pid={child.pid}" in data
                  if rc != 0 or not attached or not detached or child.poll() is not None:
                      sys.stderr.write(data)
                      raise RuntimeError("attach/detach probe failed; do not relax seccomp automatically")
                  headers = [json.loads(line.split(" ", 1)[1]) for line in data.splitlines() if line.startswith("PR17_ATOMIC_HEADER ")]
                  records = [json.loads(line.split(" ", 1)[1]) for line in data.splitlines() if line.startswith("PR17_ATOMIC ")]
                  expected = {"id": 123, "kind": 99, "phase": 1, "key": 456, "resource": 789, "parent": 0, "link": 42, "reserved": 0, "slot": 0, "claimed": False}
                  if "PR17_ATOMIC_ERROR " in data or len(headers) != 1 or headers[0]["dropped"] != 0 or headers[0]["active"] != 1 or records != [expected]:
                      sys.stderr.write(data)
                      raise RuntimeError("atomic decoder probe failed")
                  print("PR17_ATTACH_PROBE success; exact atomic record decoded and child remained alive after detach", flush=True)
              finally:
                  if debugger is not None:
                      stop_group(debugger)
                  if log is not None:
                      log.close()
                  stop_group(child)
          
          def run_target(out):
              expected = Path(os.environ["PR17_EXPECTED_EXE"]).resolve(strict=True)
              actual = Path(sys.argv[1]).resolve(strict=True)
              if actual != expected or not os.path.samefile(actual, expected):
                  raise RuntimeError(f"Cargo runner executable mismatch: {actual} != {expected}")
              attempt = int(os.environ["PR17_ATTEMPT"])
              prefix = out / f"storage-attempt-{attempt}"
              result_path = prefix.with_suffix(".result.json")
              deadline = float(os.environ["PR17_DEADLINE_MONOTONIC"])
              if deadline <= time.monotonic():
                  raise RuntimeError("attempt deadline elapsed before Cargo invoked the runner")
              env = os.environ.copy()
              env.pop("CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER", None)
              received_signal = [None]
              def receive_signal(sig, _frame):
                  if received_signal[0] is None:
                      received_signal[0] = sig
              signal.signal(signal.SIGTERM, receive_signal)
              signal.signal(signal.SIGINT, receive_signal)
          
              child = subprocess.Popen(
                  sys.argv[1:], env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  bufsize=0, start_new_session=True,
              )
              started = time.monotonic()
              progress = [started, 0]
              lock = threading.Lock()
              log_lock = threading.Lock()
              combined = prefix.with_suffix(".log").open("wb", buffering=0)
              def pump(pipe, stream, suffix):
                  with prefix.with_suffix(suffix).open("wb", buffering=0) as stream_log:
                      for line in iter(pipe.readline, b""):
                          now = time.monotonic()
                          if COMPLETED.search(ANSI.sub(b"", line).rstrip(b"\r\n")):
                              with lock:
                                  progress[0] = now
                                  progress[1] += 1
                          stream_log.write(line)
                          with log_lock:
                              combined.write(line)
                          stream.buffer.write(line)
                          stream.buffer.flush()
                  pipe.close()
              readers = [
                  threading.Thread(target=pump, args=(child.stdout, sys.stdout, ".stdout.log"), daemon=True),
                  threading.Thread(target=pump, args=(child.stderr, sys.stderr, ".stderr.log"), daemon=True),
              ]
              for reader in readers:
                  reader.start()
              print(f"PR17_NATIVE_START attempt={attempt} pid={child.pid} cwd={os.getcwd()} exe={actual}", flush=True)
          
              debugger = None
              debug_log = None
              debug_path = None
              debug_started = None
              attach_requested = False
              gdb_timed_out = False
              gdb_termination_started = None
              gdb_resumed = False
              gdb_launch_error = None
              timed_out = False
              termination_started = None
              try:
                  while child.poll() is None:
                      now = time.monotonic()
                      if termination_started is None and (now >= deadline or received_signal[0] is not None):
                          timed_out = now >= deadline
                          termination_started = now
                          group_signal(child.pid, signal.SIGTERM)
                      if termination_started is not None and now - termination_started >= KILL_GRACE:
                          group_signal(child.pid, signal.SIGKILL)
                      with lock:
                          last_completed, completed_count = progress
                      if not attach_requested and termination_started is None and now - last_completed >= QUIET_SECONDS:
                          attach_requested = True
                          print(f"PR17_DIAGNOSTIC_ATTACH attempt={attempt} pid={child.pid} quiet_s={now-last_completed:.1f} completed_lines={completed_count}; this attempt cannot be a clean pass", flush=True)
                          try:
                              debugger, debug_log, debug_path = start_gdb(child.pid, out / f"storage-attempt-{attempt}-gdb", atomic=True)
                              debug_started = time.monotonic()
                          except OSError as error:
                              gdb_launch_error = str(error)
                              print(f"PR17_GDB_LAUNCH_ERROR {error}", file=sys.stderr, flush=True)
                      if debugger is not None and debugger.poll() is None:
                          if gdb_termination_started is None and now - debug_started >= GDB_SECONDS:
                              gdb_timed_out = True
                              gdb_termination_started = now
                              group_signal(debugger.pid, signal.SIGTERM)
                          elif gdb_termination_started is not None and now - gdb_termination_started >= 5:
                              group_signal(debugger.pid, signal.SIGKILL)
                      if debugger is not None and debugger.poll() is not None and gdb_timed_out and not gdb_resumed:
                          group_signal(child.pid, signal.SIGCONT)
                          gdb_resumed = True
                      time.sleep(0.1)
              finally:
                  if child.poll() is None:
                      stop_group(child)
                  if debugger is not None:
                      stop_group(debugger)
                  if debug_log is not None:
                      debug_log.close()
                  for reader in readers:
                      reader.join(timeout=2)
                  if not any(reader.is_alive() for reader in readers):
                      combined.close()
          
              child_status = child.returncode
              if timed_out:
                  exit_status = 124
              elif received_signal[0] is not None:
                  exit_status = 128 + received_signal[0]
              else:
                  exit_status = child_status if child_status >= 0 else 128 - child_status
              debug_text = "" if debug_path is None else debug_path.read_text(encoding="utf-8", errors="replace")
              result = {
                  "attempt": attempt, "pid": child.pid, "executable": str(actual),
                  "cwd": os.getcwd(), "elapsed_s": round(time.monotonic() - started, 3),
                  "child_status": child_status, "exit_status": exit_status,
                  "deadline_exceeded": timed_out, "signal": received_signal[0],
                  "completed_test_lines": progress[1],
                  "attach_requested": attach_requested, "gdb_timed_out": gdb_timed_out,
                  "gdb_attached": f"PR17_GDB_ATTACHED pid={child.pid}" in debug_text,
                  "gdb_detached": f"PR17_GDB_DETACHED pid={child.pid}" in debug_text,
                  "gdb_status": None if debugger is None else debugger.returncode,
                  "gdb_launch_error": gdb_launch_error,
                  "gdb_log": None if debug_path is None else str(debug_path),
                  "clean_pass": False,
                  "source_instrumented": True,
                  "diagnostic_pass": exit_status == 0 and not attach_requested,
                  "classification": "atomic_instrumented_after_attach" if attach_requested else "atomic_instrumented",
              }
              result_path.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
              print("PR17_NATIVE_RESULT " + json.dumps(result, sort_keys=True), flush=True)
              return exit_status
          
          if __name__ == "__main__":
              output = Path(os.environ["PR17_DIAG_OUT"]).resolve()
              output.mkdir(parents=True, exist_ok=True)
              if sys.argv[1:] == ["--probe"]:
                  probe(output)
              elif len(sys.argv) >= 2:
                  sys.exit(run_target(output))
              else:
                  raise SystemExit("expected --probe or Cargo executable and test arguments")
          PY
          cat > "$RUNNER_TEMP/pr17-atomic-probe.c" <<'C'
          #include <stdint.h>
          #include <unistd.h>
          
          uint64_t PR17_DIAG_META[4] = {0x50523137, 1, 1024, 64};
          _Alignas(64) uint64_t PR17_DIAG_SLOTS[1024][8];
          uint64_t PR17_DIAG_DROPPED = 0;
          
          int main(void) {
              uint64_t record[8] = {123, 99, 1, 456, 789, 0, 42, 0};
              for (int i = 0; i < 8; i++) PR17_DIAG_SLOTS[0][i] = record[i];
              if (write(STDOUT_FILENO, "ready\n", 6) != 6) return 2;
              pause();
              return 0;
          }
          C
          cc -g -O0 "$RUNNER_TEMP/pr17-atomic-probe.c" -o "$RUNNER_TEMP/pr17-atomic-probe"
          export PR17_ATOMIC_PROBE="$RUNNER_TEMP/pr17-atomic-probe"
          python3 -m py_compile "$RUNNER_TEMP/pr17-late-attach.py"
          chmod +x "$RUNNER_TEMP/pr17-late-attach.py"
          export PR17_DIAG_OUT="$GITHUB_WORKSPACE/ci-out"
          "$RUNNER_TEMP/pr17-late-attach.py" --probe
      - name: Apply and record atomic-only observers
        run: |
          set -euo pipefail
          cat > ci-out/atomic-patches.json <<'JSON'
          [
            [
              "cron/mod.rs",
              "pub mod scheduler;\n",
              "pub mod scheduler;\n\n#[cfg(test)]\npub(crate) mod wait_diagnostics;\n"
            ],
            [
              "cron/documents_port.rs",
              "impl DocScope {\n",
              "impl DocScope {\n    #[cfg(test)]\n    pub(crate) fn diagnostic_key(&self) -> u64 {\n        crate::cron::wait_diagnostics::hash_parts(&[\n            self.workspace_dir.as_os_str().as_encoded_bytes(),\n            self.scope.as_str().as_bytes(),\n        ])\n    }\n\n"
            ],
            [
              "cron/documents_port.rs",
              "pub(crate) async fn address(scope: &DocScope) -> Result<CallbackAddress> {\n",
              "pub(crate) async fn address(scope: &DocScope) -> Result<CallbackAddress> {\n    #[cfg(test)]\n    let wait = crate::cron::wait_diagnostics::Span::new(1, 10, scope.diagnostic_key(), 0, 0);\n"
            ],
            [
              "cron/documents_port.rs",
              "        let scope = scope.clone();\n        runtime\n",
              "        let scope = scope.clone();\n        #[cfg(test)]\n        wait.phase(11);\n        runtime\n"
            ],
            [
              "cron/documents_port.rs",
              "async fn register_address(scope: &DocScope) -> Result<CallbackAddress> {\n    let key = scope.key();\n    let mut served = SERVED.lock().await;\n",
              "async fn register_address(scope: &DocScope) -> Result<CallbackAddress> {\n    #[cfg(test)]\n    let wait = crate::cron::wait_diagnostics::Span::new(2, 19, scope.diagnostic_key(), &SERVED as *const _ as usize as u64, 0);\n    let key = scope.key();\n    #[cfg(test)]\n    wait.phase(20);\n    let mut served = SERVED.lock().await;\n    #[cfg(test)]\n    wait.phase(21);\n"
            ],
            [
              "cron/documents_port.rs",
              "    let path = path_for(&key);\n    module::serve(\n",
              "    let path = path_for(&key);\n    #[cfg(test)]\n    {\n        wait.phase(22);\n        wait.link(crate::cron::wait_diagnostics::hash_parts(&[path.as_bytes()]));\n    }\n    module::serve(\n"
            ],
            [
              "cron/documents_port.rs",
              "    #[cfg(all(test, feature = \"modules\"))]\n    registration_tests::after_serve(&path).await;\n    tracing::debug!",
              "    #[cfg(test)]\n    wait.phase(23);\n    #[cfg(all(test, feature = \"modules\"))]\n    registration_tests::after_serve(&path).await;\n    #[cfg(test)]\n    wait.phase(24);\n    tracing::debug!"
            ],
            [
              "cron/documents_port.rs",
              "    served.insert(key, address.clone());\n",
              "    #[cfg(test)]\n    wait.phase(25);\n    served.insert(key, address.clone());\n"
            ],
            [
              "cron/client.rs",
              "    let proxy = module::proxy(config).await.map_err(|e| anyhow!(e))?;\n    tracing::trace!(member, \"[cron:bus] call\");\n    proxy.call(member, args).await.map_err(|error| {\n",
              "    #[cfg(test)]\n    let wait = crate::cron::wait_diagnostics::Span::new(13, 130, crate::cron::wait_diagnostics::hash_parts(&[config.workspace_dir.as_os_str().as_encoded_bytes()]), crate::cron::wait_diagnostics::hash_parts(&[member.as_bytes()]), 0);\n    let proxy = module::proxy(config).await.map_err(|e| anyhow!(e))?;\n    #[cfg(test)]\n    wait.phase(131);\n    tracing::trace!(member, \"[cron:bus] call\");\n    #[cfg(test)]\n    wait.phase(132);\n    proxy.call(member, args).await.map_err(|error| {\n        #[cfg(test)]\n        wait.phase(133);\n"
            ],
            [
              "cron/client.rs",
              "    if !matches!(&operation, StoreOperation::Migrate) {\n        let _: Value = store_raw(config, scope, StoreOperation::Migrate).await?;\n    }\n    store_raw(config, scope, operation).await\n",
              "    #[cfg(test)]\n    let wait = crate::cron::wait_diagnostics::Span::new(7, 70, scope.diagnostic_key(), u64::from(matches!(&operation, StoreOperation::Migrate)), 0);\n    if !matches!(&operation, StoreOperation::Migrate) {\n        #[cfg(test)]\n        wait.phase(71);\n        let _: Value = store_raw(config, scope, StoreOperation::Migrate).await?;\n    }\n    #[cfg(test)]\n    wait.phase(72);\n    store_raw(config, scope, operation).await\n"
            ],
            [
              "cron/client.rs",
              "    let request = StoreRequest {\n        storage: store_config(config, scope).await?,",
              "    #[cfg(test)]\n    let wait = crate::cron::wait_diagnostics::Span::new(11, 110, scope.diagnostic_key(), u64::from(matches!(&operation, StoreOperation::Migrate)), 0);\n    let request = StoreRequest {\n        storage: store_config(config, scope).await?,"
            ],
            [
              "cron/client.rs",
              "    let value: Value = call(config, members::SCHEDULE_STORE, (request,)).await?;\n    serde_json::from_value(value).map_err(|error| {",
              "    #[cfg(test)]\n    wait.phase(111);\n    let value: Value = call(config, members::SCHEDULE_STORE, (request,)).await?;\n    #[cfg(test)]\n    wait.phase(112);\n    serde_json::from_value(value).map_err(|error| {"
            ],
            [
              "modules/tinyflows.rs",
              "    ) -> Result<(), String> {\n        let runtime = runtime::runtime()\n",
              "    ) -> Result<(), String> {\n        #[cfg(test)]\n        let diagnostic_key = crate::cron::wait_diagnostics::hash_parts(&[path.as_bytes()]);\n        #[cfg(test)]\n        let wait = crate::cron::wait_diagnostics::Span::new(3, 30, diagnostic_key, 0, 0);\n        let runtime = runtime::runtime()\n"

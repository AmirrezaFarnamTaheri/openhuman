          cat > ci-out/tinybus-pending-apply.py <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          
          data = json.loads(Path("ci-out/tinybus-pending-candidate.json").read_text())
          root = Path("vendor/tinybus")
          assert subprocess.check_output(["git", "-C", str(root), "rev-parse", "HEAD"], text=True).strip() == data["pin"]
          path = root / "crates/tinybus/src/connection.rs"
          source = path.read_text()
          declaration = data["declaration"]
          if source.endswith(declaration):
              source = source[:-len(declaration)]
          assert len(source.encode()) == data["source_bytes"], len(source.encode())
          assert sys.argv[1] in ("red", "fixed")
          if sys.argv[1] == "fixed":
              assert len(data["repair"]) == 10
              for old, new in data["repair"]:
                  assert source.count(old) == 1, (old[:100], source.count(old))
                  source = source.replace(old, new, 1)
              existing_path = root / "crates/tinybus/src/connection_tests.rs"
              existing = existing_path.read_text()
              old, new = data["existing"]
              assert existing.count(old) == 1
              existing_path.write_text(existing.replace(old, new, 1))
              assert "pending.lock().await" not in source
          else:
              assert source.count("pending.lock().await") == 6
          path.write_text(source + declaration)
          (root / "crates/tinybus/src/connection_pending_tests.rs").write_text(data["test"])
          print("PR17_TINYBUS_CANDIDATE phase=" + sys.argv[1] + " pin=" + data["pin"])
          PY
          python3 -m py_compile ci-out/tinybus-pending-apply.py
      - name: Compile the regression against the original request bookkeeping
        run: |
          set -euo pipefail
          python3 ci-out/tinybus-pending-apply.py red
          rustfmt --edition 2024 --config skip_children=true vendor/tinybus/crates/tinybus/src/connection_pending_tests.rs
          bash scripts/ci-cancel-aware.sh cargo test --locked \
            --manifest-path vendor/tinybus/Cargo.toml -p tinybus \
            --all-features --lib --no-run
      - name: Require the original implementation to fail at the progress assertion
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=15s 45s \
            bash scripts/ci-cancel-aware.sh cargo test --locked \
            --manifest-path vendor/tinybus/Cargo.toml -p tinybus --all-features --lib \
            connection::pending_tests::unpolled_caller_does_not_block_independent_replies \
            -- --exact --nocapture > ci-out/tinybus-progress-red.log 2>&1
          status=$?
          set -e
          cat ci-out/tinybus-progress-red.log
          test "$status" -eq 101
          python3 - <<'PY'
          from pathlib import Path
          log = Path("ci-out/tinybus-progress-red.log").read_text()
          assert "an unpolled caller must not monopolize pending reply bookkeeping" in log
          assert "test result: FAILED. 0 passed; 1 failed;" in log
          assert "error[E" not in log
          print("PR17_TINYBUS_RED_VERIFIED expected progress assertion, one failed test, exit101")
          PY
      - name: Apply and format the production repair
        run: |
          set -euo pipefail
          python3 ci-out/tinybus-pending-apply.py fixed
          rustfmt --edition 2024 --config skip_children=true \
            vendor/tinybus/crates/tinybus/src/connection.rs \
            vendor/tinybus/crates/tinybus/src/connection_tests.rs \
            vendor/tinybus/crates/tinybus/src/connection_pending_tests.rs
          git -C vendor/tinybus diff --check
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          
          root = Path("vendor/tinybus")
          paths = [
              "crates/tinybus/src/connection.rs",
              "crates/tinybus/src/connection_tests.rs",
              "crates/tinybus/src/connection_pending_tests.rs",
          ]
          for relative in paths:
              text = (root / relative).read_text()
              print("PR17_TINYBUS_FORMATTED_FILE " + json.dumps({"path": relative, "content": text}))
          patch = subprocess.check_output(["git", "-C", str(root), "diff", "--", *paths[:2]], text=True)
          new = subprocess.run(["git", "-C", str(root), "diff", "--no-index", "--", "/dev/null", paths[2]], text=True, stdout=subprocess.PIPE)
          assert new.returncode == 1, new.returncode
          Path("ci-out/tinybus-pending-repair.patch").write_text(patch + new.stdout)
          PY
      - name: Require the repaired implementation to pass the identical regression
        run: |
          set -euo pipefail
          bash scripts/ci-cancel-aware.sh cargo test --locked \
            --manifest-path vendor/tinybus/Cargo.toml -p tinybus --all-features --lib --no-run
          timeout --signal=TERM --kill-after=15s 45s \
            bash scripts/ci-cancel-aware.sh cargo test --locked \
            --manifest-path vendor/tinybus/Cargo.toml -p tinybus --all-features --lib \
            connection::pending_tests::unpolled_caller_does_not_block_independent_replies \
            -- --exact --nocapture 2>&1 | tee ci-out/tinybus-progress-green.log
          python3 - <<'PY'
          from pathlib import Path
          log = Path("ci-out/tinybus-progress-green.log").read_text()
          assert "test result: ok. 1 passed; 0 failed;" in log
          print("PR17_TINYBUS_GREEN_VERIFIED identical regression passed")
          PY
      - name: Run the owning repository feature and lint gates
        run: |
          set -euo pipefail
          bash scripts/ci-cancel-aware.sh cargo test --locked --manifest-path vendor/tinybus/Cargo.toml --all-features
          bash scripts/ci-cancel-aware.sh cargo clippy --locked --manifest-path vendor/tinybus/Cargo.toml --all-targets --all-features -- -D warnings
          bash scripts/ci-cancel-aware.sh cargo check --locked --manifest-path vendor/tinybus/Cargo.toml --no-default-features
          cargo fmt --manifest-path vendor/tinybus/Cargo.toml --all -- --check
      - name: Upload the TinyBus proof and reviewable patch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr17-tinybus-pending-proof
          path: ci-out/
          retention-days: 14
          if-no-files-found: warn

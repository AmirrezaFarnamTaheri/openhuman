          import json
          import subprocess
          import sys
          from pathlib import Path
          
          data = json.loads(Path("ci-out/tinybus-pending-candidate.json").read_text())
          root = Path("vendor/tinybus")
          assert subprocess.check_output(["git", "-C", str(root), "rev-parse", "HEAD"], text=True).strip() == data["pin"]
          path = root / "crates/tinybus/src/connection.rs"
          source = path.read_text()
          declaration = data["declaration"]
          if source.endswith(declaration):
              source = source[:-len(declaration)]
          assert len(source.encode()) == data["source_bytes"], len(source.encode())
          assert sys.argv[1] in ("red", "fixed")
          if sys.argv[1] == "fixed":
              assert len(data["repair"]) == 10
              for old, new in data["repair"]:
                  assert source.count(old) == 1, (old[:100], source.count(old))
                  source = source.replace(old, new, 1)
              existing_path = root / "crates/tinybus/src/connection_tests.rs"
              existing = existing_path.read_text()
              old, new = data["existing"]
              assert existing.count(old) == 1
              existing_path.write_text(existing.replace(old, new, 1))
              assert "pending.lock().await" not in source
          else:
              assert source.count("pending.lock().await") == 6
          path.write_text(source + declaration)
          (root / "crates/tinybus/src/connection_pending_tests.rs").write_text(data["test"])
          print("PR17_TINYBUS_CANDIDATE phase=" + sys.argv[1] + " pin=" + data["pin"])

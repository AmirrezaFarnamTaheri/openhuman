name: PR21 Prettier Diff (temporary)
on:
  push:
    branches:
      - fix/diagnostic-error-swarm-20261028
permissions:
  contents: read
jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Show exact Prettier patch, without committing or weakening CI
        run: |
          cd app
          corepack pnpm exec prettier --write src/components/settings/panels/SearchPanel.tsx src/hooks/__tests__/useAppUpdate.test.ts src/lib/operationalErrors.test.ts src/lib/operationalErrors.ts
          git diff -- src/components/settings/panels/SearchPanel.tsx src/hooks/__tests__/useAppUpdate.test.ts src/lib/operationalErrors.test.ts src/lib/operationalErrors.ts
